description: >
  Full paper experiments: Pythia-1.4B, five datasets, C3PO.
  This configuration exactly replicates Experiment-1 of the paper draft.
model_name: "EleutherAI/pythia-1.4b"
seed: 42
lr: 1.0e-5
warmup: 200
max_steps: 3400         # ≈3 epochs for merged 160k pairs batch-128/ga-4
batch_size: 32 # Reduced to fit A100-80GB with 1.4B model
grad_accum: 16 # Increased to maintain effective batch size of 512
val_interval: 200
datasets:
  - {name: "tatsu-lab/alpaca_farm", split: "sft", max_len: 512}
  - {name: "HuggingFaceH4/ultrafeedback_binarized", split: "train_prefs", max_len: 512}
  - {name: "argilla/ultrafeedback-binarized-preferences-cleaned", split: "train", max_len: 512}
  - {name: "Baidicoot/anthropic-harmless-rlhf", split: "train", max_len: 512}
  - {name: "GBaker/MedQA-USMLE-4-options", split: "train", max_len: 512}
